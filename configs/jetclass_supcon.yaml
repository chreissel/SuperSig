# JetClass supervised contrastive (SupCon) on two augmented jets.  Five classes.
#   python cli.py fit --config configs/jetclass_supcon.yaml
trainer:
  accelerator: auto
  default_root_dir: runs/jetclass_supcon/
  max_epochs: 8
  log_every_n_steps: 10
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_last: true
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: runs/jetclass_supcon/

model:
  class_path: models.litmodels.SupConModule
  init_args:
    encoder:
      class_path: models.networks.JetDeepSets
      init_args:
        input_dim: 7   # kinematic features per particle (see data/jetclass_data.py)
        emb_dim: 16
    temperature: 0.1
    lr: 1.0e-3

data:
  class_path: data.datasets.JetClassTwoViewDataModule
  init_args:
    # Path to the real JetClass ROOT files, with train/ val/ test/ subdirs.
    # If the path does not exist, a synthetic 'toy' generator is used instead.
    # (Leave unset to fall back to the JETCLASS_DIR environment variable.)
    data_dir: jetclass_data/
    classes: [QCD, Tbqq, Wqq, Zqq, Hbb]   # five-class subset used for embedding training (mirrors phlab-neurips25)
    batch_size: 256
    num_workers: 1
    labeled: true
