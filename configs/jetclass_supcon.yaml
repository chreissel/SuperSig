# JetClass supervised contrastive (SupCon).  ParT encoder + projection head.
#   python cli.py fit --config configs/jetclass_supcon.yaml
trainer:
  accelerator: auto
  default_root_dir: runs/jetclass_supcon/
  max_epochs: 8
  log_every_n_steps: 10
  # Cap the data seen per epoch, mirroring phlab-neurips25 (only a fraction of the
  # full JetClass training set is used).  Falls back to using all available
  # batches when fewer exist.
  limit_train_batches: 100
  limit_val_batches: 20
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_last: true
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: SuperSIG
      name: jetclass_supcon
      group: jetclass
      save_dir: runs/jetclass_supcon/

model:
  class_path: models.litmodels.SupConModule
  init_args:
    encoder:
      class_path: models.networks.ParticleTransformerModel
      init_args:
        input_dim: 17          # 17 per-particle features (see data/jetclass_data.py)
        emb_dim: 16            # embedding / contrastive-space dimension
        embed_dims: [128, 512, 128]
        pair_embed_dims: [64, 64, 64]
        num_heads: 8
        num_layers: 8
        num_cls_layers: 2
        fc_params: [[128, 0.0]]
    projector:
      class_path: models.networks.MLP
      init_args:
        input_dim: 16
        hidden_dims: [16]
        output_dim: 16
    temperature: 0.1
    lr: 1.0e-3

data:
  class_path: data.datasets.JetClassTwoViewDataModule
  init_args:
    # Base directory holding the JetClass ROOT files, with the
    # train_100M/ val_5M/ test_20M subdirectories (reference cluster layout).
    # A missing path raises a clear error; override with $JETCLASS_DIR.
    data_dir: /n/holystore01/LABS/iaifi_lab/Lab/sambt/JetClass/
    classes: [QCD, Tbqq, Wqq, Zqq, Hbb]   # five-class subset used for embedding training (mirrors phlab-neurips25)
    batch_size: 256
    num_workers: 1
    labeled: true
