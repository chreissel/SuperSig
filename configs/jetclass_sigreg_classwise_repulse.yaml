# JetClass class-conditional SIGReg (repulse).  Five-class embedding training.
#   python cli.py fit --config configs/jetclass_sigreg_classwise_repulse.yaml
trainer:
  accelerator: auto
  default_root_dir: runs/jetclass_sigreg_classwise_repulse/
  max_epochs: 8
  log_every_n_steps: 10
  # Cap the data seen per epoch, mirroring phlab-neurips25 (only a fraction of the
  # full JetClass training set is used).  Falls back to using all available
  # batches when fewer exist (e.g. the small toy fallback).
  limit_train_batches: 100
  limit_val_batches: 20
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_last: true
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: runs/jetclass_sigreg_classwise_repulse/

model:
  class_path: models.litmodels.ClasswiseSIGRegModule
  init_args:
    encoder:
      class_path: models.networks.JetDeepSets
      init_args:
        input_dim: 7   # kinematic features per particle (see data/jetclass_data.py)
        emb_dim: 16
    mode: repulse
    n_classes: 5
    emb_dim: 16
    rep_weight: 20.0
    shrink_weight: 0.02
    lr: 1.0e-3

data:
  class_path: data.datasets.JetClassClasswiseDataModule
  init_args:
    # Path to the real JetClass ROOT files, with train/ val/ test/ subdirs.
    # If the path does not exist, a synthetic 'toy' generator is used instead.
    # (Leave unset to fall back to the JETCLASS_DIR environment variable.)
    data_dir: jetclass_data/
    classes: [QCD, Tbqq, Wqq, Zqq, Hbb]   # five-class subset used for embedding training (mirrors phlab-neurips25)
    batch_size: 256
    num_workers: 1
