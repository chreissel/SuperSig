# JetClass supervised baseline: ParticleTransformer backbone + classifier.
# Five-class embedding training (QCD, Tbqq, Wqq, Zqq, Hbb), mirroring phlab-neurips25.
#   python cli.py fit --config configs/jetclass_supervised.yaml
trainer:
  accelerator: auto
  default_root_dir: runs/jetclass_supervised/
  max_epochs: 100
  log_every_n_steps: 10
  # Cap the data seen per epoch, mirroring phlab-neurips25 (only a fraction of the
  # full JetClass training set is used).  Falls back to using all available
  # batches when fewer exist.
  limit_train_batches: 100
  limit_val_batches: 20
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_last: true
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 20         # stop when val/loss stalls (reference value)
        mode: min
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: SuperSIG
      name: jetclass_supervised
      group: jetclass
      save_dir: runs/jetclass_supervised/

model:
  class_path: models.litmodels.SupervisedModule
  init_args:
    model:
      class_path: models.networks.SupervisedJetNet
      init_args:
        input_dim: 17
        emb_dim: 8
        n_classes: 5
    lr: 1.0e-3

data:
  class_path: data.datasets.JetClassDataModule
  init_args:
    # Base directory holding the JetClass ROOT files, with the
    # train_100M/ val_5M/ test_20M subdirectories (reference cluster layout).
    # A missing path raises a clear error; override with $JETCLASS_DIR.
    data_dir: /n/holystore01/LABS/iaifi_lab/Lab/sambt/JetClass/
    classes: [QCD, Tbqq, Wqq, Zqq, Hbb]   # five-class subset used for embedding training (mirrors phlab-neurips25)
    batch_size: 256
    num_workers: 1
