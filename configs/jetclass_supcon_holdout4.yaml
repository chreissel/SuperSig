# JetClass hold-out-4 SupCon: class 4 (Hbb) removed from the embedding-training jets.
#   python cli.py fit --config configs/jetclass_supcon_holdout4.yaml
trainer:
  accelerator: auto
  default_root_dir: runs/jetclass_supcon_holdout4/
  max_epochs: 8
  log_every_n_steps: 10
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_last: true
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: runs/jetclass_supcon_holdout4/

model:
  class_path: models.litmodels.SupConModule
  init_args:
    encoder:
      class_path: models.networks.JetDeepSets
      init_args:
        input_dim: 7   # kinematic features per particle (see data/jetclass_data.py)
        emb_dim: 16
    temperature: 0.1
    lr: 1.0e-3

data:
  class_path: data.datasets.JetClassTwoViewDataModule
  init_args:
    classes: [QCD, Tbqq, Wqq, Zqq, Hbb]   # five-class subset used for embedding training (mirrors phlab-neurips25)
    batch_size: 256
    num_workers: 1
    labeled: true
    holdout: 4
