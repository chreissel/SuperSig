# JetClass class-conditional SIGReg (repulse).
#   python cli.py fit --config configs/jetclass_sigreg_holdout4_repulse.yaml
trainer:
  accelerator: auto
  default_root_dir: runs/jetclass_sigreg_holdout4_repulse/
  max_epochs: 8
  log_every_n_steps: 10
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_last: true
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: runs/jetclass_sigreg_holdout4_repulse/

model:
  class_path: models.litmodels.ClasswiseSIGRegModule
  init_args:
    encoder:
      class_path: models.networks.JetDeepSets
      init_args:
        input_dim: 7   # kinematic features per particle (see data/jetclass_data.py)
        emb_dim: 16
    mode: repulse
    rep_weight: 20.0
    shrink_weight: 0.02
    lr: 1.0e-3

data:
  class_path: data.datasets.JetClassClasswiseDataModule
  init_args:
    batch_size: 256
    num_workers: 1
    holdout: 4
