# Class-conditional SIGReg, learnable means kept apart by a hinge separation term.
#   python cli.py fit --config configs/mnist_sigreg_classwise_learnmeans.yaml
trainer:
  accelerator: auto
  default_root_dir: runs/mnist_sigreg_classwise_learnmeans/
  max_epochs: 8
  log_every_n_steps: 20
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_last: true
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: SuperSIG
      name: mnist_sigreg_classwise_learnmeans
      group: mnist
      save_dir: runs/mnist_sigreg_classwise_learnmeans/

model:
  class_path: models.litmodels.ClasswiseSIGRegModule
  init_args:
    encoder:
      class_path: models.networks.ConvBackbone
      init_args:
        emb_dim: 16
    mode: learnmeans
    beta_sep: 0.5
    lr: 1.0e-3

data:
  class_path: data.datasets.ClasswiseMNISTDataModule
  init_args:
    batch_size: 256
    num_workers: 2
