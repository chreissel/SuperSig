# JetClass supervised SimCLR (single view, reference-faithful): one un-augmented
# view per jet, positives from labels, SupervisedSimCLRLoss on the projection.
# This mirrors phlab-neurips25's JetClassSimCLRModel(sup_simclr=True).
#
# Trains on the full [QCD, Tbqq, Wqq, Zqq, Hbb] set with a 4-dim embedding /
# projection.  See jetclass_supsimclr_holdout4.yaml for the run with Hbb held
# out.
#   python cli.py fit --config configs/jetclass_supsimclr.yaml
trainer:
  accelerator: auto
  default_root_dir: runs/jetclass_supsimclr/
  max_epochs: 100
  log_every_n_steps: 1
  # Cap the data seen per epoch, mirroring phlab-neurips25.
  limit_train_batches: 100
  limit_val_batches: 20
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_last: true
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 20         # reference (phlab-neurips25) value
        mode: min
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: SuperSIG
      name: jetclass_supsimclr
      group: jetclass
      save_dir: runs/jetclass_supsimclr/

model:
  class_path: models.litmodels.SupSimCLRModule
  init_args:
    encoder:
      class_path: models.networks.ParticleTransformerModel
      init_args:
        input_dim: 17          # 17 per-particle features (see data/jetclass_data.py)
        emb_dim: 4             # embedding / projection dimension
        embed_dims: [128, 512, 128]
        pair_embed_dims: [64, 64, 64]
        num_heads: 8
        num_layers: 8
        num_cls_layers: 2
        fc_params: [[128, 0.0]]
    projector:
      class_path: models.networks.MLP
      init_args:
        input_dim: 4           # MLP 4 -> [4] -> 4
        hidden_dims: [4]
        output_dim: 4
    temperature: 0.1
    # classifier: null   # optional cross-entropy head (as in the reference)
    lr: 5.0e-4
    weight_decay: 0.01   # reference leaves AdamW weight_decay at the 0.01 default
    t_max: 100         # reference (phlab-neurips25): CosineAnnealingLR T_max
    eta_min: 1.0e-6    # reference: CosineAnnealingLR eta_min

data:
  class_path: data.datasets.JetClassDataModule    # plain (features, label) -- single view
  init_args:
    data_dir: /n/holystore01/LABS/iaifi_lab/Lab/sambt/JetClass/
    classes: [QCD, Tbqq, Wqq, Zqq, Hbb]   # full five-class set
    batch_size: 1024   # reference (phlab-neurips25) value
    num_workers: 1
